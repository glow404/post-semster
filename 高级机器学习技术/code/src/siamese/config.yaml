method:
  name: "Siamese Network + Contrastive Loss"
  type: "supervised_metric_learning"

data:
  train_pairs: "data/pairs_train.csv"
  val_pairs: "data/pairs_val.csv"
  test_pairs: "data/pairs_test.csv"
  image_root: "."
  image_size:
    height: 100
    width: 110
  input_shape: [1, 100, 110]

model:
  encoder: "lightweight_cnn"
  embedding_dim: 128
  l2_normalize: true
  dropout: 0.2

loss:
  name: "contrastive_loss"
  margin: 1.0
  eps: 0.00000001
  positive_label: 1
  negative_label: 0

train:
  batch_size: 64
  epochs: 200
  lr: 0.001
  weight_decay: 0.0001
  optimizer: "AdamW"
  scheduler: "ReduceLROnPlateau"
  num_workers: 4
  seed: 42
  device: "cuda"
  random_horizontal_flip: false
  augmentation:
    random_rotation_degrees: 8
    random_affine_translate: 0.03

validation:
  threshold_grid: 101
  threshold_metric: "f1"
  positive_rule: "distance <= threshold"
  best_model_metric: "val_auc"

eval:
  checkpoint: "results/siamese/best_siamese.pth"
  batch_size: 64
  num_workers: 4
  device: "cuda"

output:
  output_dir: "results/siamese"
  checkpoint: "best_siamese.pth"
  train_log: "train_log.csv"
  test_scores: "test_scores.csv"
  metrics: "metrics.json"
  roc_curve: "roc_curve.png"
  config: "config.json"
