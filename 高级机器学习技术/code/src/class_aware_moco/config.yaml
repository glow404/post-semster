method:
  name: "Class-aware MoCo"
  type: "class_aware_momentum_contrast"

data:
  train_labels: "data/labels_train.csv"
  val_pairs: "data/pairs_val.csv"
  test_pairs: "data/pairs_test.csv"
  all_labels: "data/labels.csv"
  image_root: "."
  image_size:
    height: 100
    width: 110
  input_shape: [1, 100, 110]

label_encoding:
  label_map: "results/class_aware_moco/label_map.json"
  source: "data/labels.csv"

model:
  encoder: "lightweight_cnn"
  embedding_dim: 128
  l2_normalize: true
  dropout: 0.2
  query_encoder: "encoder_q"
  key_encoder: "encoder_k"

moco:
  queue_size: 4096
  momentum: 0.999
  temperature: 0.07
  queue_label_empty_value: -1
  positive_policy:
    current_key_is_positive: true
    same_finger_id_in_queue_is_positive: true
  similarity: "dot_product_on_l2_normalized_embeddings"

loss:
  name: "class_aware_multi_positive_contrastive_loss"
  reduction: "batch_mean"
  numerical_stability: "logsumexp"

train:
  batch_size: 64
  epochs: 100
  lr: 0.001
  weight_decay: 0.0001
  optimizer: "AdamW"
  scheduler: "CosineAnnealingLR"
  num_workers: 4
  seed: 42
  device: "cuda"
  blur_prob: 0.2
  random_horizontal_flip: false
  augmentation:
    random_rotation_degrees: 8
    random_affine_translate: 0.03
    gaussian_blur_kernel_size: 3
    gaussian_blur_sigma: [0.1, 0.8]

validation:
  threshold_grid: 101
  threshold_metric: "f1"
  positive_rule: "distance <= threshold"
  best_model_metric: "val_auc"
  tie_breaker: "val_eer"

eval:
  checkpoint: "results/class_aware_moco/best_class_aware_moco.pth"
  batch_size: 64
  num_workers: 4
  device: "cuda"
  distance: "euclidean"

output:
  output_dir: "results/class_aware_moco"
  checkpoint: "best_class_aware_moco.pth"
  train_log: "train_log.csv"
  test_scores: "test_scores.csv"
  metrics: "metrics.json"
  roc_curve: "roc_curve.png"
  config: "config.json"
  label_map: "label_map.json"
